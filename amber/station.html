<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>熔金指挥舱 · 场站详情</title>
  <meta name="author" content="duanchangpeng@gmail.com">
  <link rel="stylesheet" href="css/style.css?v=am3">
</head>
<body>
  <div id="stage">
    <!-- ===== 顶部 ===== -->
    <header class="top">
      <div class="brand">
        <svg class="mark" viewBox="0 0 40 44">
          <path d="M20 2 37 12v20L20 42 3 32V12Z" fill="none" stroke="url(#g1)" stroke-width="2"/>
          <path d="M23 13 15 25h5l-2 8 9-13h-6z" fill="#ffcf7a"/>
          <defs><linearGradient id="g1" x1="0" y1="0" x2="0" y2="44">
            <stop offset="0" stop-color="#ffd98a"/><stop offset="1" stop-color="#c97a10"/>
          </linearGradient></defs>
        </svg>
        <div class="tt">
          <h1 id="st-name">场站详情</h1>
          <p id="st-sub">STATION DETAIL · AMBER CONSOLE</p>
        </div>
      </div>
      <div class="top-mid">
        <span class="lab">SYSTEM TIME</span>
        <span class="big" id="clk">--:--:--</span>
        <span class="sep"></span>
        <span class="lab" id="dte">----</span>
      </div>
      <div class="top-right">
        <a class="btn-back" href="index.html">◈ 返回总览</a>
        <a class="mail" href="mailto:duanchangpeng@gmail.com">duanchangpeng@gmail.com</a>
        <a class="home" href="../index.html">▦ 展厅</a>
      </div>
    </header>

    <!-- ===== 通栏 KPI ===== -->
    <section class="kpis" id="kpis"></section>

    <!-- ===== 主区 ===== -->
    <main class="body">
      <section class="map-zone">
        <div class="map-head">
          <span class="tick"></span><h2>场站布局实况 · LAYOUT</h2>
          <span class="rule"></span>
          <span class="lab" id="lay-lab">-- PILES</span>
        </div>
        <div class="map-box"><div class="lay-stage" id="lay"></div></div>
        <div class="map-foot" id="lay-foot"></div>
      </section>

      <aside class="stack">
        <section class="card">
          <h3><span class="tick"></span>桩群状态 · PILE STATUS</h3>
          <div class="chart" id="rose"></div>
        </section>
        <section class="card">
          <h3><span class="tick"></span>今日功率曲线 · POWER</h3>
          <div class="chart" id="load"></div>
        </section>
        <section class="card grow">
          <h3><span class="tick"></span>充电桩监视 · MONITOR</h3>
          <div class="p-grid" id="pgrid"><div id="pinner"></div></div>
        </section>
        <section class="card alerts">
          <h3><span class="tick"></span>本站快报 · BULLETIN</h3>
          <div class="alist" id="alist"></div>
        </section>
      </aside>
    </main>

    <!-- ===== 底部 ===== -->
    <footer class="foot">
      <span class="dot"></span><span class="tag">LIVE WIRE</span>
      <div class="tv"><div class="tt-move" id="ticker"></div></div>
      <span class="copy">© 2026 AMBER CONSOLE · <a href="mailto:duanchangpeng@gmail.com">duanchangpeng@gmail.com</a></span>
    </footer>
  </div>

  <script src="../assets/echarts.min.js"></script>
  <script src="../assets/data.js"></script>
  <script src="../assets/layout.js"></script>
  <script src="js/station.js?v=am3"></script>
</body>
</html>
