<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智慧充电管理平台 · 场站详情</title>
  <meta name="author" content="duanchangpeng@gmail.com">
  <link rel="stylesheet" href="css/style.css?v=li3">
</head>
<body>
  <div id="app">
    <!-- ===== 侧导航 ===== -->
    <nav class="nav">
      <div class="logo">
        <svg viewBox="0 0 36 36"><rect x="3" y="3" width="30" height="30" rx="9" fill="#2563eb"/>
        <path d="M20 10 13 20h4.4L15.6 26l7.4-10.4h-4.6z" fill="#fff"/></svg>
        <div><b>智慧充电</b><span>济南 · 运营平台</span></div>
      </div>
      <div class="tabs">
        <a class="tab" href="index.html">▤ 总览</a>
        <a class="tab on" href="javascript:;">◫ 场站</a>
        <a class="tab" href="javascript:;">⚡ 桩群</a>
        <a class="tab" href="javascript:;">◎ 订单</a>
        <a class="tab" href="javascript:;">⚑ 告警</a>
      </div>
      <div class="nav-foot">
        <div class="user">
          <span class="avt">运</span>
          <div><b>运营调度中心</b><span>SC-01 值班席</span></div>
        </div>
        <a class="mail" href="mailto:duanchangpeng@gmail.com">✉ duanchangpeng@gmail.com</a>
        <a class="home" href="../index.html">▦ 返回展厅</a>
      </div>
    </nav>

    <!-- ===== 主区 ===== -->
    <main class="main">
      <header class="hd">
        <div>
          <h1 id="st-name">场站详情 <span id="st-sub"></span></h1>
          <p>数据每 5 秒自动刷新 · 最后更新 <em id="upd">--:--:--</em></p>
        </div>
        <a class="back" href="index.html">← 返回总览</a>
      </header>

      <!-- 指标卡行 -->
      <section class="metrics" id="metrics"></section>

      <!-- 网格主体 -->
      <section class="grid">
        <div class="card span2 row2">
          <div class="c-hd"><b>桩位实况 · 点击高亮</b><span class="pill" id="pile-pill">--</span></div>
          <div class="c-bd"><div class="pile-flow" id="pile-flow"><div class="pile-track" id="pile-track"></div></div></div>
        </div>
        <div class="card trend-card">
          <div class="c-hd"><b>今日功率曲线</b><span class="pill blue">kW</span></div>
          <div class="c-bd"><div class="chart" id="power"></div></div>
        </div>
        <div class="card donut-card">
          <div class="c-hd"><b>桩群状态</b><span class="pill">--</span></div>
          <div class="c-bd"><div class="chart" id="donut"></div></div>
        </div>
        <div class="card span2 order-card">
          <div class="c-hd"><b>最新订单 · 本站</b><span class="pill green">实时流入</span></div>
          <div class="c-bd">
            <div class="tb-hd"><span>时间</span><span>桩号</span><span>车牌</span><span>电量</span><span>金额</span><span>状态</span></div>
            <div class="tb-scroll"><div class="tb-in" id="orders"></div></div>
          </div>
        </div>
        <div class="card info-card">
          <div class="c-hd"><b>站点信息</b></div>
          <div class="c-bd"><div class="info-rows" id="info"></div></div>
        </div>
      </section>

      <footer class="ft">
        <span>© 2026 智慧充电管理平台 · 济南</span>
        <span>Designed by <a href="mailto:duanchangpeng@gmail.com">duanchangpeng@gmail.com</a></span>
      </footer>
    </main>
  </div>

  <script src="../assets/echarts.min.js"></script>
  <script src="../assets/data.js"></script>
  <script src="js/station.js?v=li3"></script>
</body>
</html>
